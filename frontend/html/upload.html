<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Study Planner — Upload & IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="theme-warm">
  <div id="site-header"></div>
  <script src="../js/header.js" defer></script>

  <main class="grid" style="padding:16px">
    <section>
      <h2>Subir PDF y Generar Contenido (IA)</h2>

      <form id="formUpload" enctype="multipart/form-data">
        <label>Summary</label>
        <select id="summaryId" required></select>

        <label>Archivo PDF</label>
        <input id="pdfFile" type="file" accept="application/pdf" required />

        <button type="submit">Subir PDF</button>
      </form>

      <div class="actions">
        <button id="btnExtractTopics">🔎 IA: Extraer Topics</button>
        <button id="btnGenCards">🧠 IA: Generar Cards</button>
        <input id="perPage" type="number" min="1" max="5" value="2" title="Cards por página de PDF" style="width:80px" />
        <button id="btnListTopics">Ver Topics</button>
        <button id="btnListCards">Ver Cards</button>
      </div>

      <div id="results" class="cards"></div>

      <footer><span id="status" class="muted"></span></footer>
    </section>
  </main>

  <script type="module">
    import { API, $, j, setStatus } from "../js/common.js";

    const sel = $("#summaryId");
    const form = $("#formUpload");
    const file = $("#pdfFile");
    const results = $("#results");

    async function loadSummaries() {
      const r = await fetch(`${API}/api/summaries`);
      const data = await j(r);
      sel.innerHTML = "";
      data.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = `${s.title} (#${s.id})`;
        sel.appendChild(opt);
      });
      setStatus(`Summaries: ${data.length}`, "ok");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const sid = Number(sel.value);
      if (!sid || !file.files[0]) {
        return setStatus("Elegí summary y archivo PDF", "error");
      }
      const fd = new FormData();
      fd.append("file", file.files[0]);
      try {
        const r = await fetch(`${API}/api/summaries/${sid}/upload-pdf`, { method:"POST", body: fd });
        await j(r);
        setStatus("PDF subido ✔", "ok");
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    $("#btnExtractTopics").addEventListener("click", async () => {
      const sid = Number(sel.value);
      if (!sid) return setStatus("Elegí un summary", "error");
      try {
        const r = await fetch(`${API}/api/summaries/${sid}/ai/extract-topics`, { method:"POST" });
        const data = await j(r);
        setStatus(`Topics creados: ${data.topics}`, "ok");
        await listTopics();
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    $("#btnGenCards").addEventListener("click", async () => {
      const sid = Number(sel.value);
      const per = Number($("#perPage").value) || 2;
      if (!sid) return setStatus("Elegí un summary", "error");
      try {
        const r = await fetch(`${API}/api/summaries/${sid}/ai/generate-cards?per_page=${per}`, { method:"POST" });
        const data = await j(r);
        setStatus(`Cards generadas: ${data.cards}`, "ok");
        await listCards();
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    async function listTopics() {
      const sid = Number(sel.value);
      if (!sid) return;
      const r = await fetch(`${API}/api/summaries/${sid}/topics`);
      const data = await j(r);
      results.innerHTML = "";
      if (!data.length) {
        const d = document.createElement("div");
        d.className = "card";
        d.textContent = "No hay topics aún.";
        results.appendChild(d);
        return;
      }
      data.forEach(t => {
        const d = document.createElement("div"); d.className="card";
        d.innerHTML = `<strong>${t.title}</strong><div class="muted">pág. ${t.startPage}–${t.endPage}</div>`;
        results.appendChild(d);
      });
    }

    async function listCards() {
      const sid = Number(sel.value);
      if (!sid) return;
      const r = await fetch(`${API}/api/summaries/${sid}/cards`);
      const data = await j(r);
      results.innerHTML = "";
      if (!data.length) {
        const d = document.createElement("div");
        d.className = "card";
        d.textContent = "No hay cards aún.";
        results.appendChild(d);
        return;
      }
      data.forEach(c => {
        const d = document.createElement("div"); d.className="card";
        d.innerHTML = `
          <div class="muted">pág. ${c.originPage ?? "?"}</div>
          <div><strong>Q:</strong> ${c.question}</div>
          <div><strong>A:</strong> ${c.answer}</div>
        `;
        results.appendChild(d);
      });
    }

    $("#btnListTopics").addEventListener("click", () => listTopics().catch(err=>setStatus(err.message,"error")));
    $("#btnListCards").addEventListener("click", () => listCards().catch(err=>setStatus(err.message,"error")));

    loadSummaries().catch(()=>{});
  </script>
</body>
</html>

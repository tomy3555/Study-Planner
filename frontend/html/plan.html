<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan</title>

  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../theme.css?v=9" />

  <style>
    .plan-card{
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-5);
      box-shadow: var(--shadow);
      max-width: 900px;
      margin: 16px auto;
    }
    .grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap:.75rem; }
    .row-end{ display:grid; grid-template-columns: 1fr auto; gap:.75rem; }
    @media (max-width:700px){
      .grid-2, .row-end{ grid-template-columns: 1fr; }
    }
    /* filtros de tareas: sin “Plan ID” a la vista */
    .tasks-filters{
      display:grid; grid-template-columns: 1fr 1fr auto; gap:.5rem;
      align-items: end; margin-top: 1rem;
    }
    @media (max-width:700px){
      .tasks-filters{ grid-template-columns: 1fr; }
    }
    .muted{ color: var(--text-muted); }
    /* campo Plan ID oculto (lo usamos internamente) */
    #tasksPlanIdWrap{ display:none; }
    #advToggle{ min-width: 230px; }
  </style>
</head>
<body class="theme-warm">
  <div id="site-header"></div>

  <main class="grid" style="padding:16px">
    <section class="plan-card">
      <h2>Generar plan</h2>
      <p class="text-muted" style="margin:.2rem 0 1rem">
        Elegí el resumen y el rango de fechas. Las tareas se crean automáticamente.
      </p>

      <form id="planForm" class="form" style="padding:0; border:0; box-shadow:none;">
        <div class="field">
          <label class="label" for="planSummaryId">Resumen</label>
          <select id="planSummaryId" class="input" required></select>
        </div>

        <div class="field grid-2">
          <div>
            <label class="label" for="planStartDate">Día que podés empezar a estudiar</label>
            <input id="planStartDate" class="input" type="date" required>
          </div>
          <div>
            <label class="label" for="planEndDate">Día que querés terminar</label>
            <input id="planEndDate" class="input" type="date" required>
          </div>
        </div>

        <!-- Opciones avanzadas, plegadas por defecto -->
         <div class="row-end" style="margin-top:.5rem">
          <div></div>
            <button type="button" class="btn btn-outline" id="advToggle" aria-expanded="false">
              Mostrar opciones avanzadas
            </button>
          </div>
        <details id="advOptions" class="field">
          <summary class="label" style="display:none">Opciones avanzadas (opcional)</summary>
          <div class="grid-2" style="margin-top:.6rem">
            <div>
              <label class="label" for="planReadRatio">Read Ratio</label>
              <input id="planReadRatio" class="input" type="number" step="0.1" min="0.1" max="0.9" value="0.6" required>
              <div class="help">Proporción del tiempo para **leer** vs. repasar (0.6 = 60% leer).</div>
            </div>
            <div>
              <label class="label" for="planBufferDays">Buffer Days</label>
              <input id="planBufferDays" class="input" type="number" min="0" max="3" value="2" required>
              <div class="help">Días “colchón” por si te atrasás.</div>
            </div>
            <div>
              <label class="label" for="planReviewQuota">Review Quota</label>
              <input id="planReviewQuota" class="input" type="number" min="0" max="200" value="20" required>
              <div class="help">Cuánto repasar por día (cantidad de items/unidades).</div>
            </div>
          </div>
        </details>

        <div class="row-end">
          <div id="status" class="help" aria-live="polite" style="min-height:1.2rem"></div>
          <button class="btn">Generar</button>
        </div>
      </form>

      <!-- Filtros para ver tareas del plan actual (sin mostrar Plan ID) -->
      <div class="tasks-filters">
        <div>
          <label class="label" for="tasksFrom">Desde</label>
          <input id="tasksFrom" class="input" type="date">
        </div>
        <div>
          <label class="label" for="tasksTo">Hasta</label>
          <input id="tasksTo" class="input" type="date">
        </div>
        <div style="align-self:end">
          <button id="btnLoadTasks" class="btn btn-outline">Ver tareas</button>
        </div>
      </div>

      <!-- Plan ID oculto (uso interno) -->
      <div id="tasksPlanIdWrap">
        <input id="tasksPlanId" type="number">
      </div>

      <div id="tasksList" class="cards" style="margin-top:1rem"></div>
    </section>
  </main>

  <script src="../js/header.js" defer></script>
  <script type="module">
    import { API, $, j, setStatus as setStatusCommon } from "../js/common.js";

    const sel  = $("#planSummaryId"),
          start= $("#planStartDate"),
          end  = $("#planEndDate"),
          ratio= $("#planReadRatio"),
          buf  = $("#planBufferDays"),
          quota= $("#planReviewQuota"),
          pid  = $("#tasksPlanId"),
          from = $("#tasksFrom"),
          to   = $("#tasksTo"),
          tasks= $("#tasksList"),
          btn  = $("#btnLoadTasks"),
          statusEl = $("#status");
          const advBtn = document.getElementById("advToggle");
const advBox = document.getElementById("advOptions");
const ADV_KEY = "sp_plan_adv_open";

// estado inicial desde localStorage
const savedAdvOpen = localStorage.getItem(ADV_KEY) === "1";
advBox.open = savedAdvOpen;
advBtn.setAttribute("aria-expanded", String(savedAdvOpen));
advBtn.textContent = savedAdvOpen ? "Ocultar opciones avanzadas" : "Mostrar opciones avanzadas";

// toggle al click
advBtn.addEventListener("click", () => {
  advBox.open = !advBox.open;
  const isOpen = advBox.open;
  advBtn.setAttribute("aria-expanded", String(isOpen));
  advBtn.textContent = isOpen ? "Ocultar opciones avanzadas" : "Mostrar opciones avanzadas";
  localStorage.setItem(ADV_KEY, isOpen ? "1" : "0");
});

    let summariesCache = [];
    let lastPlanId = null;

    function setStatus(msg, type){
      // Usa el helper común si querés colores; acá con texto simple alcanza
      statusEl.textContent = msg || "";
      if (setStatusCommon) try{ setStatusCommon(msg, type); } catch {}
    }

    const today = new Date().toISOString().slice(0,10);
    start.value = today;

    async function loadSummaries(){
      const r = await fetch(`${API}/api/summaries`);
      const data = await j(r);
      summariesCache = data || [];
      sel.innerHTML = "";
      // Mostrar solo el título (sin #id)
      summariesCache.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;                 // value numérico para el backend
        opt.textContent = s.title || "Sin título";
        sel.appendChild(opt);
      });
      // Si hay examen en el primero, autocompletar fin
      if (summariesCache.length && summariesCache[0].examDate){
        end.value = summariesCache[0].examDate;
      }
    }

    sel.addEventListener("change", () => {
      const s = summariesCache.find(x => x.id === Number(sel.value));
      if (s && s.examDate) end.value = s.examDate;
    });

    async function generate(e){
      e.preventDefault();
      const payload = {
        summaryId: Number(sel.value),
        startDate: start.value,
        endDate:   end.value,
        readRatio: Number(ratio.value),
        bufferDays:Number(buf.value),
        reviewQuota:Number(quota.value)
      };
      const r = await fetch(`${API}/api/plans/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await j(r);

      lastPlanId = data.id;   // guardamos internamente
      pid.value = data.id;    // queda oculto
      from.value = ""; to.value = "";
      await listTasks();      // mostrar al toque

      setStatus("Plan generado correctamente.", "ok"); // sin mostrar #id
    }

    function fmtExtra(t){
      if (t.taskType === "read")    return `pág. ${t.startPage}-${t.endPage}`;
      if (t.taskType === "review")  return `cuota: ${t.reviewQuota}`;
      if (t.taskType === "practice")return `práctica: ${t.practiceItems ?? 1}`;
      return "";
    }

    async function listTasks(){
      const id = lastPlanId || Number(pid.value);
      if (!id){ setStatus("Generá un plan primero.", "error"); return; }

      const p = new URLSearchParams();
      if (from.value) p.set("from_date", from.value);
      if (to.value)   p.set("to_date", to.value);

      const r = await fetch(`${API}/api/plans/${id}/tasks${p.toString() ? `?${p.toString()}` : ""}`);
      const data = await j(r);

      tasks.innerHTML = "";
      (data || []).forEach(t => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="row" style="align-items:center; gap:.5rem;">
            <strong>${t.dayDate}</strong>
            <span class="badge">${t.taskType}</span>
            <span class="badge ${t.status}">${t.status}</span>
          </div>
          <div>${t.notes ?? ""}</div>
          <div class="muted">${fmtExtra(t)}</div>
        `;
        tasks.appendChild(div);
      });

      setStatus(`Tareas: ${(data || []).length}`, "ok");
    }

    document.getElementById("planForm").addEventListener("submit", (e) =>
      generate(e).catch(err => setStatus(err.message, "error"))
    );
    btn.addEventListener("click", () =>
      listTasks().catch(err => setStatus(err.message, "error"))
    );

    loadSummaries().catch(()=>{});
  </script>
</body>
</html>

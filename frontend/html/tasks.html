<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Study Planner — Tareas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../theme.css?v=12" />
  <style>
    .tasks-card{ background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius);
      padding:var(--space-5); box-shadow:var(--shadow); max-width:1000px; margin:16px auto; }
    .grid-3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:.75rem; }
    .grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap:.75rem; }
    .row-end{ display:grid; grid-template-columns: 1fr auto; gap:.75rem; }
    @media (max-width:900px){ .grid-3{ grid-template-columns: 1fr 1fr; } }
    @media (max-width:640px){ .grid-3,.grid-2,.row-end{ grid-template-columns: 1fr; } }
    .tasks-list{ margin-top:1rem; }
    .muted{ color: var(--text-muted); }
  </style>
</head>
<body class="theme-warm">
  <div id="site-header"></div>
  <script src="../js/header.js" defer></script>

  <main class="grid" style="padding:16px">
    <section class="tasks-card">
      <h2>Tareas</h2>
      <p class="text-muted" style="margin:.2rem 0 1rem">
        Elegí la materia y el resumen. Por defecto se usa el plan más reciente.
      </p>

      <!-- Filtros “humanos” -->
      <div class="grid-3">
        <div>
          <label class="label" for="subjectSel">Materia</label>
          <select id="subjectSel" class="input"></select>
        </div>
        <div>
          <label class="label" for="summarySel">Resumen</label>
          <select id="summarySel" class="input"></select>
        </div>
        <div>
          <label class="label" for="planSel">Plan (opcional)</label>
          <select id="planSel" class="input">
            <option value="">(más reciente)</option>
          </select>
        </div>
      </div>

      <div class="grid-2" style="margin-top:.75rem">
        <div>
          <label class="label" for="fromDate">Desde</label>
          <input id="fromDate" class="input" type="date" />
        </div>
        <div>
          <label class="label" for="toDate">Hasta</label>
          <input id="toDate" class="input" type="date" />
        </div>
      </div>

      <div class="row-end" style="margin-top:.75rem">
        <div class="flex" style="gap:.5rem; flex-wrap:wrap">
          <button id="btnToday" class="btn btn-ghost">Hoy</button>
          <button id="btnNext7" class="btn btn-ghost">Próx. 7 días</button>
        </div>
        <button id="btnLoad" class="btn">Ver tareas</button>
      </div>

      <div id="status" class="help" style="min-height:1.2rem; margin-top:.25rem"></div>

      <!-- Lista -->
      <div id="tasksList" class="cards tasks-list"></div>
    </section>
  </main>

  <script type="module">
    import { API, $, j, setStatus } from "../js/common.js";

    const subjectSel = $("#subjectSel");
    const summarySel = $("#summarySel");
    const planSel    = $("#planSel");
    const fromEl     = $("#fromDate");
    const toEl       = $("#toDate");
    const listEl     = $("#tasksList");
    const statusEl   = $("#status");

    const btnToday  = $("#btnToday");
    const btnNext7  = $("#btnNext7");
    const btnLoad   = $("#btnLoad");

    // === Helpers ===
    const todayStr = () => new Date().toISOString().slice(0,10);
    const addDays = (d, n) => { const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); };
    const prettyDate = (v) => { const d=new Date(v); return isNaN(d)? String(v): d.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}); };

    function status(msg, type){ statusEl.textContent = msg || ""; try{ setStatus?.(msg, type) }catch{} }

    // Fallback: mapa “último plan por resumen” guardado en plan.html
    function getLastPlanIdForSummary(summaryId){
      try{
        const raw = localStorage.getItem("sp_last_plan_by_summary");
        if (!raw) return null;
        const map = JSON.parse(raw);
        const val = map[String(summaryId)];
        return typeof val === "number" ? val : (val?.id ?? null);
      }catch{ return null; }
    }

    // Intenta obtener planes del resumen desde el backend con varios endpoints conocidos.
    async function fetchPlansForSummary(summaryId){
      const endpoints = [
        `${API}/api/summaries/${summaryId}/plans`,
        `${API}/api/plans?summaryId=${summaryId}`,
        `${API}/api/plans/latest?summaryId=${summaryId}` // podría devolver {id,...}
      ];
      for (const url of endpoints){
        try{
          const r = await fetch(url);
          if (!r.ok) continue;
          const data = await j(r);
          // Normalizamos: devolvemos array [{id, label}]
          if (Array.isArray(data)){
            return data.map(p => ({ id: p.id, label: planLabel(p) }));
          }else if (data && typeof data === "object" && data.id){
            return [{ id: data.id, label: planLabel(data) }];
          }
        }catch{}
      }
      // Si no hay endpoints, usar el “último plan local”
      const localId = getLastPlanIdForSummary(summaryId);
      return localId ? [{ id: localId, label: "(último plan)" }] : [];
    }

    function planLabel(p){
      // Nombre legible: “Inicio – Fin” o “Plan #id”
      const start = p.startDate || p.start || p.from;
      const end   = p.endDate   || p.end   || p.to;
      if (start || end) return `${start ?? "¿?"} → ${end ?? "¿?"}`;
      return `Plan #${p.id}`;
    }

    // === Carga de selects ===
    let subjects = [];
    let summaries = [];

    async function loadSubjects(){
      const r = await fetch(`${API}/api/subjects`);
      subjects = await j(r);
      subjectSel.innerHTML = `<option value="">(todas)</option>`;
      (subjects||[]).forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name;
        subjectSel.appendChild(opt);
      });
    }

    async function loadSummaries(){
      const r = await fetch(`${API}/api/summaries`);
      summaries = await j(r);
      fillSummaries();
    }

    function fillSummaries(){
      const selectedSubject = Number(subjectSel.value || 0);
      const list = (summaries||[]).filter(s => !selectedSubject || Number(s.subjectId) === selectedSubject);
      summarySel.innerHTML = "";
      list.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.title || "Sin título";
        summarySel.appendChild(opt);
      });
      // al cambiar la lista, actualizamos planes
      updatePlans().catch(()=>{});
    }

    async function updatePlans(){
      planSel.innerHTML = `<option value="">(más reciente)</option>`;
      const sid = Number(summarySel.value || 0);
      if (!sid) return;
      const plans = await fetchPlansForSummary(sid);
      for (const p of plans){
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.label;
        planSel.appendChild(opt);
      }
    }

    subjectSel.addEventListener("change", fillSummaries);
    summarySel.addEventListener("change", () => updatePlans());

    // === Render de tareas ===
    function renderTasks(tasks){
      listEl.innerHTML = "";
      if (!tasks?.length){
        const empty = document.createElement("div");
        empty.className = "card";
        empty.textContent = "No hay tareas para el rango seleccionado.";
        listEl.appendChild(empty);
        return;
      }

      listEl.onclick = async (e) => {
        const btn = e.target.closest("button[data-id][data-status]");
        if (!btn) return;
        const id = Number(btn.dataset.id);
        const status = btn.dataset.status;
        try{
          const r = await fetch(`${API}/api/tasks/${id}`, {
            method:"PATCH",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ status })
          });
          await j(r);
          await loadTasks(); // refresca
          status(`Tarea actualizada`, "ok");
        }catch(err){ status(err.message, "error"); }
      };

      for (const t of tasks){
        const card = document.createElement("div");
        card.className = "card";
        const badge = (cls, txt) => `<span class="badge ${cls}">${txt}</span>`;

        let extra = "";
        if (t.taskType === "read") extra = `pág. ${t.startPage}-${t.endPage}`;
        else if (t.taskType === "review") extra = `cuota: ${t.reviewQuota}`;
        else if (t.taskType === "practice") extra = `práctica: ${t.practiceItems ?? 1}`;

        card.innerHTML = `
          <div class="row" style="align-items:center; gap:.5rem;">
            <strong>${prettyDate(t.dayDate)}</strong>
            ${badge("", t.taskType)}
            ${badge(t.status, t.status)}
          </div>
          <div>${t.notes ?? ""}</div>
          <div class="muted">${extra}</div>
          <div class="actions" style="gap:.5rem; margin-top:.5rem;">
            <button class="btn btn-sm" data-id="${t.id}" data-status="done">✔ Hecha</button>
            <button class="btn btn-sm btn-outline" data-id="${t.id}" data-status="skipped">⏭ Omitir</button>
            <button class="btn btn-sm btn-ghost" data-id="${t.id}" data-status="pending">↺ Pendiente</button>
          </div>
        `;
        listEl.appendChild(card);
      }
    }

    // === Carga de tareas (usa plan elegido o “más reciente”) ===
    async function loadTasks(){
      const sid = Number(summarySel.value || 0);
      if (!sid){ return status("Elegí un resumen", "error"); }

      let planId = planSel.value ? Number(planSel.value) : null;

      // si no elegiste plan explícito, intentamos “el más reciente”
      if (!planId){
        // 1) endpoint de último plan
        try{
          const r = await fetch(`${API}/api/plans/latest?summaryId=${sid}`);
          if (r.ok){
            const data = await j(r);
            planId = data?.id ?? null;
          }
        }catch{}

        // 2) fallback a localStorage si sigue null
        if (!planId){
          planId = getLastPlanIdForSummary(sid);
        }
      }

      if (!planId){
        renderTasks([]);
        return status("No encuentro un plan para este resumen. Generá uno en Plan.", "error");
      }

      const qs = new URLSearchParams();
      if (fromEl.value) qs.set("from_date", fromEl.value);
      if (toEl.value)   qs.set("to_date", toEl.value);

      try{
        const r = await fetch(`${API}/api/plans/${planId}/tasks${qs.toString() ? `?${qs}` : ""}`);
        const data = await j(r);
        renderTasks(data);
        status(`Tareas: ${data?.length ?? 0}`, "ok");
      }catch(err){
        status(err.message, "error");
      }
    }

    // Rápidos
    btnToday.addEventListener("click", () => {
      const t = todayStr();
      fromEl.value = t; toEl.value = t;
      loadTasks();
    });
    btnNext7.addEventListener("click", () => {
      const t = todayStr();
      fromEl.value = t; toEl.value = addDays(t, 7);
      loadTasks();
    });
    btnLoad.addEventListener("click", () => loadTasks());

    // Inicial
    fromEl.value = todayStr();
    await loadSubjects().catch(()=>{});
    await loadSummaries().catch(()=>{});
  </script>
</body>
</html>
